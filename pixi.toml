[workspace]
name      = "CrossAncestryGenPhenTCGA"
authors   = ["dkatzlberger"]
version   = "0.1.0"
channels  = ["conda-forge", "bioconda"]
platforms = [
  { platform = "osx-64", macos = "15.7.9" }
]

[dependencies]

## R Baseline
r-base           = "4.5.*"
r-languageserver = ">=0.3.18,<0.4"
r-renv           = ">=1.2.3,<2"
r-httpgd         = ">=2.1.4,<3"
r-systemfonts    = ">=1.3.2,<2"
r-textshaping    = ">=1.0.5,<2"
r-svglite        = ">=2.2.2,<3"

## Toolchain & Build Automation
compilers  = ">=1.6.0"
make       = "*"
cmake      = ">=3.28"
pkg-config = ">=0.29"
hdf5       = ">=2.2.0,<3"

## Core system libs
zlib      = ">=1.3.2,<2"
glpk      = ">=5,<6"
libxml2   = "*"
libcurl   = "*"
curl      = "*"
openssl   = "*"
xz        = "*"
gsl       = "*"
libblas   = { version = "*", build = "*openblas" }
liblapack = { version = "*", build = "*openblas" }

## Graphics / Font (Breaking the pcre2 dependency loop)
freetype    = "*"
fontconfig  = "*"
harfbuzz    = "*"
fribidi     = "*"
imagemagick = "*"
cairo       = "*"
pixman      = "*"
cairosvg    = "*"
librsvg     = "*"
